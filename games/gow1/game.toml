# Game profile: God of War (PS2, NTSC-U). Read by tools/pipeline/profile.py (the pipeline, the disc tools and the
# launcher all take their game-specific values from here; nothing game-specific is hard-coded elsewhere).
id = "gow1"
title = "God of War"
status = "playable"            # playable | in-progress | planned

[executable]
name = "SCUS_973.99"           # the ELF named by SYSTEM.CNF (BOOT2); the runtime's overrides are registered for this name
serial = "SCUS-97399"
crc = "D6385328"               # PCSX2 game CRC (XOR of the ELF's 32-bit words) of the original disc
# SHA-1 of the ELF's .text: the recompiled code depends only on it, so any disc whose executable has this code (the
# original or a translation that only changes data) recompiles to the same program
text_sha1 = "8c6e61a95e84e88b01a0cea25b3824cf6b2cbe00"

[runtime]
# paths inside the runtime checkout (engine/runtime.toml) used by the pipeline
recompiler_template = "config/recomp.template.toml"
function_map = "config/funcmap.csv"
overrides = ["src/gow_overrides.cpp", "src/gow_pad2_packet.h", "src/gow_gs_replay.h"]
vu1_generator = "tools/vu1/generar_vu1.cpp"
vu1_native_generator = "tools/vu1/vu1n_gen.py"
# VU1 block entry points the generator cannot find in the microcode (jumps through a register); without them those blocks
# run in the interpreter and every run leaves and re-enters native code (~1.2 M times per 5 s in ship combat)
vu1_native_heads = "vu1n_heads.txt"
iop_native_generator = "tools/iop/iopn_gen.py"

[disc]
toc = "GODOFWAR.TOC"           # 24-byte entries: name[12], u32 part (0 = PART1.PAK, 1 = PART2.PAK), u32 size, u32 sector
paks = ["PART1.PAK", "PART2.PAK"]
iop_modules_dir = "IOP_MOD"    # the game loads its IRX modules as IOP_MOD/<name>.irx next to the ELF
text_files = ["R_PERM.WAD", "R_SHELL.WAD"]   # where a translation's text lives
widescreen_movie_ext = ".PSW"  # the 16:9 movies; the port plays them, so a disc without them maps them to .PSS
movie_ext = ".PSS"
# The standalone PT-BR disc has reduced SEMO widescreen placeholders that cannot complete playback.
# Match exact bytes, not a general size threshold: short valid movies must survive.
widescreen_placeholders = [
    {size = 16388, sha256 = "98117b3548648b5aec8843bd95fd0187f7b59411b8e0f70d403ce25d0e6c190c"},
    {size = 114692, sha256 = "97a80e440f6ca7d6253069629351d78984826ebb50d738832af7bc901640702a"},
]

[build]
unity_batch = 16

[optimize]
# scripted run that records the VU1 microcode and IOP modules the game uses (Tobiichi's recording script)
seconds = 240
pad_script = "5:start,12:x,18:x,24:x,30:x,36:x,40:cuadrado,41:cuadrado,42:cuadrado,44:triangulo,48:lup*3,52:x,55:cuadrado,56:triangulo,60:circulo,64:r1,70:lleft*2,74:cuadrado,76:cuadrado,80:triangulo,90:lup*4,96:x,100:cuadrado,104:l1,110:lright*2,120:cuadrado,125:triangulo,140:lup*5,150:cuadrado,160:triangulo,180:lup*5,200:cuadrado"

[diagnostics]
frame_pc = "0x1837B8"          # vid::Flip: guest frames, distinct from host presentation rate

[diagnostics.scenes.ship_guard]
# Private blank-card benchmark: initial ship encounter, no movement/camera input.
# A 50-unit envelope allows observed block/knockback motion; not a frozen replay.
# Holding block and refilling health keep the initial arena active without deaths.
pad_script = "5:start,12:x,18:x,24:x,30:x,36:x,g0:l1*600"
god_mode = true
position_tolerance = 50.0
zones = ["Athn01A", "Athn01B"]

[diagnostics.scenes.ship_frames]
# Rejected combat pilot: arrival/knockback still diverges. Keep gates mandatory;
# do not use its timing as a valid comparison until trajectories match.
pad_script = "5:start,12:x,18:x,24:x,30:x,36:x,f0:l1*100000"
god_mode = true
position_tolerance = 50.0
zones = ["Athn01A", "Athn01B"]
frame_begin = 240
frame_end = 840
trajectory_tolerance = 25.0

[diagnostics.scenes.ship_arrival_frames]
# Rendered arrival before combat, not an FMV or paused menu. The zero-length
# frame entry suppresses leftover menu confirms without pressing a gameplay key.
pad_script = "5:start,12:x,18:x,24:x,30:x,36:x,f0:l1*0"
god_mode = false
position_tolerance = 50.0
zones = ["Athn01A", "Athn01B"]
frame_begin = 0
frame_end = 360
trajectory_tolerance = 25.0

# Known discs: the game as released. Fan translations are not listed: any disc whose .text matches text_sha1 is
# accepted as a translation, and its language is guessed from the words below.
[[editions]]
id = "usa"
kind = "original"
language = "en"
label = "English (USA)"
elf_crc = "D6385328"

# Recognition is separate from runtime support. These executables must NOT use the
# USA function map/overrides. Serials: PCSX2 bin/resources/GameIndex.yaml.
# Japan identity measured from the user's disc; no disc bytes are stored here.
[[regions]]
id = "japan"
elf = "SLPM_670.10"
language = "ja"
label = "Japanese (Japan)"
known_crc = "CA052D22"
known_text_sha1 = "8ed48ca88c73e7e340be3a8e7ff16b07825cb96c"
experimental_frame_pc = "0x183BB8"
experimental_menu_confirm = "circulo"

# Asia, second pressing. Measured on 2026-11-03 from a supplied SCAJ-97399 image: its boot executable is the
# Japanese one byte for byte (same CRC, same .text SHA-1 and size), so the disc runs the Japan build and never
# the USA one. `code` names the region whose build runs this executable, without asking for a second build of
# identical code; the disc data (movies, text, layout) stays its own. Its shell is Chinese: the first boot on a
# Japan build (2026-11-03) rendered "新游戏" / "确定" over the Japanese logo, so the localization lives in the
# disc's textures and the executable stays the Japanese one. The profile's language_hints only see the
# Japanese build's internal strings and return "en", which is why this value is recorded by hand.
[[regions]]
id = "asia-97399"
elf = "SCAJ_973.99"
language = "zh"
label = "God of War (Asia, SCAJ-97399, Chinese)"
known_crc = "CA052D22"
known_text_sha1 = "8ed48ca88c73e7e340be3a8e7ff16b07825cb96c"
code = "japan"
experimental_frame_pc = "0x183BB8"
experimental_menu_confirm = "circulo"

[[regions]]
id = "asia"
elf = "SCAJ_300.10"
language = "unknown"
label = "God of War (Asia)"

[[regions]]
id = "europe"
elf = "SCES_531.33"
known_crc = "FB0E6D72"
known_text_sha1 = "706831f2064ca73bf83d3cff4e02764fa26bfff1"
experimental_frame_pc = "0x1838A8"
experimental_menu_confirm = "x"
language = "multi"
label = "God of War (Europe / Australia)"

[[regions]]
id = "europe-alt"
elf = "SCES_515.33"
language = "unknown"
label = "God of War (Europe, alternate serial)"

[[regions]]
id = "demo-usa"
elf = "SCUS_974.67"
language = "en"
label = "God of War Demo (USA)"
demo = true

[[regions]]
id = "demo-europe"
elf = "SCED_534.31"
language = "multi"
label = "God of War Demo (Europe / Australia)"
demo = true

# menu sentences that identify a language in R_PERM.WAD / R_SHELL.WAD (text_files) of a translated disc (not single
# words: names such as "Difficulty" are also internal identifiers, left untranslated)
[language_hints]
"pt-BR" = ["Novo Jogo", "Aperte [XButton]", "Termine o jogo para desbloquear"]
"es" = ["Nueva partida", "Cargar partida", "Dificultad"]
"fr" = ["Nouvelle partie", "Charger", "Difficulté"]
"de" = ["Neues Spiel", "Laden", "Schwierigkeit"]
"it" = ["Nuova partita", "Carica", "Difficoltà"]
"en" = ["New Game", "Press [XButton]", "Beat the game to unlock"]
